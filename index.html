<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>หมวกคัดสรรบรรพ</title>
  <style>
/* ล็อกการคลิกทั้งหน้าจอชั่วคราว */
#interactionLock {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: transparent;
    display: none;
    cursor: wait;
}

    * { box-sizing: border-box; }
    body {
      font-family: 'Chakra Petch', Arial, sans-serif;
      background: #0f1123; color: #e2e8f0; text-align: center;
      padding: 20px; margin: 0; min-height: 100vh;
    }
    .container {
      max-width: 600px; margin: 40px auto; background: #1a1c35;
      padding: 40px 30px; border-radius: 20px; border: 2px solid #7928ca;
      box-shadow: 0 10px 30px rgba(0,0,0,.6); position: relative;
    }
    h2 { color: #fbd38d; margin-top: 10px; font-size: 32px; }
    p { line-height: 1.6; }
    input.student-input {
      padding: 14px; width: 90%; margin: 15px auto; font-size: 16px;
      border-radius: 10px; border: 2px solid #4a5568; background: #2d3748;
      color: white; text-align: center; outline: none; display: block;
    }
    input.student-input:focus { border-color: #ff0080; }
    button {
      background: linear-gradient(135deg,#7928ca 0%,#ff0080 100%);
      color: white; border: 0; padding: 14px 25px; font-size: 16px;
      font-weight: bold; border-radius: 10px; cursor: pointer;
      transition: transform .2s, opacity .2s;
      box-shadow: 0 4px 15px rgba(255,0,128,.3); margin: 15px auto;
    }
    button:hover:not(:disabled) { transform: scale(1.03); }
    button:disabled { opacity: .55; cursor: wait; }
    .btn-house {
      background: linear-gradient(135deg,#00b4db 0%,#0083b0 100%);
      box-shadow: 0 4px 15px rgba(0,180,219,.4);
      margin-top: 20px; width: 100%;
    }
    .btn-back { background: #4a5568; box-shadow: none; margin-top: 30px; }
    .status { min-height: 24px; color: #fbd38d; font-size: 14px; margin: 5px 0; }
    .result-box {
      margin-top: 30px; padding: 25px; background: #23274a;
      border-radius: 15px; border: 2px solid #ff0080;
      display: none; text-align: left;
    }

    .cohort-badge {
      font-size: 70px;
      font-weight: bold;
      text-align: center;
      color: #ff0080;
      filter: drop-shadow(0 0 10px currentColor);
      margin: 10px 0 20px;
      transition: color 0.5s ease, filter 0.5s ease;
    }

    .info-item { 
      font-size: 16px;
      margin: 12px 0;
      line-height: 1.6;
      overflow-wrap: anywhere;
      }
    .info-label { font-weight: bold; color: #a0aec0; }
    .highlight-text { color: #fbd38d; font-weight: bold; }
    .house-screen {
      display: none; 
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;

    /* พื้นหลังเปลี่ยนตามสีประจำบ้าน */
      background:
        radial-gradient(circle at 50% 20%,
        var(--house-accent, #29204f) 0%,
        var(--house-bg, #0f1123) 55%,
        #080b18 100%);

    z-index: 100;
    overflow-y: auto;
    padding: 50px 20px;

    align-items: center;
    justify-content: center;

    transition: background 0.7s ease;
    }

/* เฟดหน้าผลการคัดสรรออกก่อนกลับหน้าหลัก */
.house-screen.is-closing {
    animation: houseScreenFadeOut 0.45s ease-in forwards;
    pointer-events: none;
}

@keyframes houseScreenFadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
}

/* การ์ดแสดงผลบ้าน */
.house-card {
    position: relative;
    overflow: visible;
    max-width: 550px;
    margin: auto;
    padding: 40px 30px;

    background:
        radial-gradient(
            circle at top,
            var(--house-accent, #ae2525) 0%,
            var(--house-bg, #250000) 75%
        );

    border: 4px solid var(--house-border, #7928ca);
    border-radius: 25px;

    box-shadow:
        0 0 20px var(--house-glow, rgba(121,40,202,.35)),
        0 15px 40px rgba(0,0,0,.5);
}

/* ด้านหลังไพ่ที่แสดงระหว่างการสุ่ม */
.sorting-card-back {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 3;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    border-radius: 20px;
    background:
        radial-gradient(circle at center, rgba(255,255,255,.12), transparent 55%),
        linear-gradient(145deg, #29204f, #100d25 65%, #34204d);
    box-shadow: inset 0 0 0 8px rgba(255,255,255,.07),
                inset 0 0 25px rgba(255,215,130,.25);
    pointer-events: none;
}

.sorting-card-symbol {
    color: #fbd38d;
    font-size: 48px;
    line-height: 1;
    text-shadow: 0 0 18px rgba(251,211,141,.8);
}

.sorting-card-label {
    color: #fbd38d;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 5px;
    border-top: 1px solid rgba(251,211,141,.6);
    border-bottom: 1px solid rgba(251,211,141,.6);
    padding: 10px 0;
}

/* ไอคอนประจำบ้าน */
.house-emoji {
    width: 120px;
    height: 120px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto 20px;
    font-size: 75px;

    background: radial-gradient(
        circle,
        var(--house-accent),
        var(--house-bg)
    );

    border: 3px solid var(--house-text);
    border-radius: 50%;

    box-shadow:
        0 0 15px var(--house-glow),
        0 0 30px var(--house-glow),
        inset 0 0 15px rgba(255,255,255,.15);
}

/* ชื่อบ้าน */
.house-name {
    color: var(--house-text);
    font-size: 32px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;

    text-shadow: 0 0 15px var(--house-glow);
}

/* กล่องประโยคประจำบ้าน */
.house-quote-box {
    background: rgba(0,0,0,.45);
    border: 1px solid var(--house-border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 25px;
}

/* แผงควบคุมเสียง */
.audio-panel {
    position: fixed; top: 12px; right: 12px; z-index: 200;
    display: flex; align-items: center; gap: 9px; padding: 9px 12px;
    border: 1px solid rgba(251,211,141,.35); border-radius: 14px;
    background: rgba(26,28,53,.92); box-shadow: 0 4px 18px rgba(0,0,0,.35);
    backdrop-filter: blur(8px); color: #fbd38d; font-size: 13px;
}
.audio-panel button { margin: 0; padding: 7px 10px; font-size: 13px; box-shadow: none; }
.audio-panel input[type="range"] { width: 75px; accent-color: #fbd38d; }
@media (max-width: 480px) {
    .audio-panel { top: 8px; right: 8px; padding: 7px; gap: 6px; }
    .audio-panel input[type="range"] { width: 55px; }
}

/* รองรับโทรศัพท์มือถือ */
@media (max-width: 480px) {
    body { padding: 12px; }
    .container { margin: 20px auto; padding: 28px 18px; }
    h2 { font-size: 27px; }
    .cohort-badge { font-size: 58px; }

    .house-card { padding: 30px 18px; }
    .house-name { font-size: 27px; }

    .house-emoji {
        width: 100px;
        height: 100px;
        font-size: 65px;
    }
}

/* =================================
   1. เอฟเฟกต์เปิดเผยผลตรวจสอบรายชื่อ
================================= */

.magic-reveal {
  animation: magicReveal 0.8s ease-out both;
}

@keyframes magicReveal {
  0% {
    opacity: 0;
    transform: scale(0.75);
    filter: brightness(3) blur(8px);
  }
  60% {
    opacity: 1;
    transform: scale(1.05);
    filter: brightness(1.8) blur(0);
  }
  100% {
    opacity: 1;
    transform: scale(1);
    filter: brightness(1);
  }
}

/* =================================
   2. เอฟเฟกต์หมุนการ์ด
================================= */

.house-card.is-sorting {
  transform-style: preserve-3d;
  will-change: transform;
  /* เร่งความเร็วอย่างต่อเนื่องจากเริ่มต้นจนจบ ไม่แบ่งเป็นช่วงกระชาก */
  animation: magicalSpin 2.2s cubic-bezier(.42, 0, 1, 1) both;
}

/* ระหว่างหมุน ซ่อนรายละเอียดทั้งหมดและแสดงเฉพาะด้านหลังไพ่ */
.house-card.is-sorting > :not(.sorting-card-back) {
  visibility: hidden;
  opacity: 0;
}

.house-card.is-sorting .sorting-card-back {
  display: flex;
}

@keyframes magicalSpin {
  0% {
    transform: perspective(1000px) rotateY(0deg) scale(.22);
  }
  100% {
    /* หมุนต่อเนื่องหลายรอบ พร้อมขยายเต็มขนาด โดยความเร็วเพิ่มขึ้นเรื่อย ๆ */
    transform: perspective(1000px) rotateY(1440deg) scale(1);
  }
}

/* =================================
   3. เอฟเฟกต์ระเบิดเวทมนตร์
================================= */

.house-card.magic-burst::after {
  content: "";
  position: absolute;
  z-index: 5;
  pointer-events: none;
  inset: -35%;

  background:
    radial-gradient(circle, #fff 0%, #ffeaa0 5%, transparent 18%),
    radial-gradient(circle at 20% 30%, #ffffff 0%, transparent 5%),
    radial-gradient(circle at 80% 25%, #ffeaa0 0%, transparent 6%),
    radial-gradient(circle at 30% 80%, #ffffff 0%, transparent 5%),
    radial-gradient(circle at 75% 75%, #f5d77a 0%, transparent 7%);

  animation: magicExplosion 0.9s ease-out forwards;
}

@keyframes magicExplosion {
  0% {
    opacity: 1;
    transform: scale(0.1) rotate(0deg);
  }
  50% {
    opacity: 1;
    transform: scale(1.1) rotate(90deg);
  }
  100% {
    opacity: 0;
    transform: scale(1.8) rotate(180deg);
  }
}

/* =================================
   4. เอฟเฟกต์เผยชื่อบ้าน
================================= */

.name-reveal {
  animation: revealHouseName 0.8s ease-out both;
}

@keyframes revealHouseName {
  0% {
    opacity: 0;
    transform: scale(0.3) translateY(25px);
    filter: blur(10px);
  }
  60% {
    opacity: 1;
    transform: scale(1.2) translateY(-5px);
    filter: blur(0);
    text-shadow: 0 0 25px currentColor;
  }
  100% {
    opacity: 1;
    transform: scale(1) translateY(0);
    filter: blur(0);
  }
}

// ==========================================
// ฟังก์ชันแสดงผลบ้านที่ได้รับ
// ==========================================
function showHouse(selectedHouse, studentId, studentName) {
    // ระหว่างสุ่มยังไม่กำหนดสีบ้าน เพื่อไม่ให้ใบ้ผลลัพธ์

    document.getElementById("screenHouseName").textContent = selectedHouse.name;
    document.getElementById("screenHouseQuote").textContent = selectedHouse.quote;
    document.getElementById("screenId").textContent = studentId;
    document.getElementById("screenStudentName").textContent = studentName;

    const screen = document.getElementById("houseScreen");
    const card = document.getElementById("houseCard");
    [screen, card].forEach(target => {
        target.style.setProperty("--house-border", "#7928ca");
        target.style.setProperty("--house-text", "#fbd38d");
        target.style.setProperty("--house-bg", "#0f1123");
        target.style.setProperty("--house-accent", "#29204f");
        target.style.setProperty("--house-glow", "rgba(121,40,202,.35)");
    });

const $ = (id) => document.getElementById(id);

function setStatus(message, isError = false) {
  $('statusMessage').textContent = message;
  $('statusMessage').style.color = isError ? '#fc8181' : '#fbd38d';
}

// อ่านผลลัพธ์ตามโครงสร้างจริงที่ doGet() ส่งกลับมา
function lookupStudent(id) {
  return new Promise((resolve, reject) => {
    const callbackName = 'studentCallback_' + Date.now() + '_' +
      Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    let finished = false;
    let callbackReceived = false;

    const cleanup = () => {
      if (finished) return;
      finished = true;
      clearTimeout(timeout);
      delete window[callbackName];
      script.remove();
    };

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error(
        'ไม่ได้รับคำตอบจาก Google Sheets ภายใน 15 วินาที กรุณาตรวจสอบ URL และการ Deploy Google Apps Script'
      ));
    }, 15000);

    window[callbackName] = (response) => {
      callbackReceived = true;
      cleanup();

      if (!response || typeof response !== 'object') {
        reject(new Error('ข้อมูลที่ได้รับจาก Google Sheets ไม่ถูกต้อง'));
        return;
      }

      // ส่ง error จริงจาก Apps Script กลับไปแสดงบนหน้าเว็บ
      if (response.success !== true) {
        reject(new Error(response.error || 'ไม่สามารถตรวจสอบข้อมูลนิสิตได้'));
        return;
      }

      const returnedId = String(response.id || '').trim();
      const clean = value => String(value || '').replace(/[\s-]/g, '').trim();

      if (!returnedId || clean(returnedId) !== clean(id)) {
        reject(new Error('รหัสนิสิตที่ได้รับจากฐานข้อมูลไม่ตรงกับรหัสที่กรอก'));
        return;
      }

      resolve(response);
    };

    script.onerror = () => {
      cleanup();
      reject(new Error(
        'โหลดข้อมูลจาก Google Apps Script ไม่สำเร็จ กรุณาตรวจสอบการเผยแพร่ Web App และสิทธิ์การเข้าถึง'
      ));
    };

    // หากโหลดสคริปต์ได้ แต่ไม่มีการเรียก callback ให้แจ้งสาเหตุ
    script.onload = () => {
      setTimeout(() => {
        if (!callbackReceived && !finished) {
          cleanup();
          reject(new Error(
            'Google Apps Script ตอบกลับมาแต่ไม่ได้เรียก JSONP callback กรุณาตรวจสอบฟังก์ชัน doGet()'
          ));
        }
      }, 0);
    };

    const separator = API_URL.includes('?') ? '&' : '?';
    script.src = API_URL + separator +
      'id=' + encodeURIComponent(id) +
      '&callback=' + encodeURIComponent(callbackName);

    document.body.appendChild(script);
  });
}

function getCohortFromId(id) {
  const lastDigit = Number(id.slice(-1));
  if (!Number.isNaN(lastDigit)) return lastDigit === 0 ? 6 : lastDigit % 6;
  return (id.length % 6) + 1;
}

async function processIdentity(event) {
  if (event) event.preventDefault();
  if (requestInProgress) return;

  const id = $('studentId').value.trim();
  if (!id) {
    setStatus('กรุณากรอกรหัสนิสิตก่อนนะครับ', true);
    $('studentId').focus();
    return;
  }

  requestInProgress = true;
  $('identityButton').disabled = true;
  $('identityButton').textContent = '⏳ กำลังร่ายคาถาตรวจสอบข้อมูล...';
  $('resultBox').style.display = 'none';
  selectedStudent = null;
  setStatus('กำลังเปิดบันทึกทะเบียนแห่งฮอกวอตส์...');

  try {
    const student = await lookupStudent(id);

    // ใช้ cohort จากคอลัมน์ D ตามที่ Apps Script ส่งมา
    const cohortValue = Number(String(student.cohort || '').trim());
    const cohort = Number.isInteger(cohortValue) && patronusData[cohortValue]
      ? cohortValue : getCohortFromId(id);
    const chosen = patronusData[cohort];

    selectedStudent = {
      id: String(student.id || id).trim(),
      name: String(student.name || ''),
      cohort: cohort,
      year: String(student.year || '')
    };

      // แสดงหัวข้อบรรพพร้อมเปลี่ยนสีตามบรรพ
      $('outCohort').textContent = `บรรพ ${chosen.cohort}`;
      $('outCohort').style.color = chosen.hexColor;
      $('outCohort').style.filter =
      `drop-shadow(0 0 12px ${chosen.hexColor})`;

      // แสดงข้อมูลนิสิต
      $('outId').textContent = selectedStudent.id;
      $('outName').textContent = selectedStudent.name;

      // แสดงสัตว์ประจำบรรพ
      $('outPatronus').textContent =
      `${chosen.animal} [${chosen.color}] ของ ${chosen.name}`;

      // แสดงสีประจำบรรพพร้อมอิโมจิ
      $('outColor').textContent =
      `${chosen.colorEmoji} ${chosen.color}`;

      // แสดงคำพูดประจำตัวละคร
      $('outQuote').textContent = `“${chosen.quote}”`;

      $('resultBox').style.display = 'block';

// เอฟเฟกต์เปิดเผยข้อมูลนิสิต
    const result = $('resultBox');

    result.classList.remove('magic-reveal');
    void result.offsetWidth;
    result.classList.add('magic-reveal');
    playPatronusAppearSound();

    setStatus(
      'ตรวจสอบข้อมูลสำเร็จ' +
      (selectedStudent.name ? ' — ' + selectedStudent.name : '') +
      (selectedStudent.year ? ' (ปี ' + selectedStudent.year + ')' : '')
    );
  } catch (error) {
    setStatus(error.message || 'เกิดข้อผิดพลาดในการตรวจสอบข้อมูล', true);
  } finally {
    requestInProgress = false;
    $('identityButton').disabled = false;
    $('identityButton').textContent = '✨ คำตัดสินของหมวก ✨';
  }
}

function lockScreen(duration = 800) {
    const lock = $('interactionLock');

    clearTimeout(interactionLockTimer);

        lock.style.display = 'none';

function sortingHouse() {
    if (!selectedStudent) {
        setStatus('กรุณาตรวจสอบรหัสนิสิตก่อนเข้าสู่พิธีคัดสรรบ้าน', true);

    }
    // ป้องกันการกดปุ่มซ้ำ

    isSortingHouse = true;
    $('houseButton').disabled = true;
    $('houseButton').style.pointerEvents = 'none';

    // สุ่มเลือกบ้านจาก houseData
    const house = houseData[
        Math.floor(Math.random() * houseData.length)
    ];

    const card = $('houseCard');
    const houseName = $('screenHouseName');
    const houseEmoji = $('screenHouseEmoji');

    // ล้างเอฟเฟกต์เดิม
    card.classList.remove('magic-burst');
    houseName.classList.remove('name-reveal');
    houseEmoji.classList.remove('name-reveal');

    // เริ่มหมุนการ์ด โดยใช้พื้นหลังกลางตลอดการสุ่ม
    card.classList.add('is-sorting');

    // แสดงผลบ้าน
    showHouse(
        house,
        selectedStudent.id,
        selectedStudent.name
    );

    // ปิดการเลื่อนหน้าจอหลัก
    document.body.style.overflow = 'hidden';

    // รอให้การ์ดหมุนเสร็จ 2.2 วินาที
    sortingAnimationTimer = setTimeout(() => {

    // หยุดหมุนก่อน แล้วจึงค่อยเปิดเผยสีประจำบ้าน
    card.classList.remove('is-sorting');
    applyHouseTheme(house);

    // ระเบิดเวทมนตร์
    playMagicBurstSound();
    card.classList.remove('magic-burst');
    void card.offsetWidth;
    card.classList.add('magic-burst');

    // เผยชื่อบ้านและสัญลักษณ์
    houseName.classList.remove('name-reveal');
    houseEmoji.classList.remove('name-reveal');

    void houseName.offsetWidth;

    houseName.classList.add('name-reveal');
    houseEmoji.classList.add('name-reveal');
    playRevealSound();

    // ปลดล็อกปุ่ม
    isSortingHouse = false;
    $('houseButton').disabled = false;
    $('houseButton').style.pointerEvents = 'auto';

  }, 2200);

    // โฟกัสปุ่มกลับ
    $('backButton').focus();
}
function closeHouseScreen() {
  const screen = $('houseScreen');

  // ป้องกันการกดปิดซ้ำระหว่างเอฟเฟกต์เฟด
  if (isClosingHouse || screen.style.display !== 'flex') return;
  isClosingHouse = true;
  clearTimeout(sortingAnimationTimer);
  clearTimeout(sortingUnlockTimer);

  sortingAnimationTimer = null;
  sortingUnlockTimer = null;
  screen.classList.remove('is-closing');
  void screen.offsetWidth;
  screen.classList.add('is-closing');

  // ซ่อนหน้าผลลัพธ์หลังเฟดเสร็จ
  setTimeout(() => {
    screen.style.display = 'none';
    screen.classList.remove('is-closing');

    // รีเซ็ต Animation เพื่อให้เริ่มรอบใหม่ได้
    const card = $('houseCard');
    const houseName = $('screenHouseName');
    const houseEmoji = $('screenHouseEmoji');
    card.classList.remove('is-sorting', 'magic-burst');
    houseName.classList.remove('name-reveal');
    houseEmoji.classList.remove('name-reveal');

    // คืนค่าหน้าหลัก
    document.body.style.overflow = '';

    isSortingHouse = false;
    isClosingHouse = false;

    $('houseButton').disabled = false;
    $('houseButton').style.pointerEvents = 'auto';

        // ล็อกการคลิกทั้งหน้าจอ 1 วินาที
        lockScreen(800);

    $('houseButton').focus();
  }, 450);
}


// ==========================================
// ระบบเสียงประกอบด้วย Web Audio API
// ไม่ต้องใช้ไฟล์เสียงภายนอก
// ==========================================
let audioContext = null, masterGain = null, bgmNodes = [];
let audioEnabled = true, audioReady = false, lastTypingSound = 0;

function initAudio() {
  if (audioReady) return;
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) return;
  audioContext = new AudioCtx();
  masterGain = audioContext.createGain();
  masterGain.gain.value = Number($('volumeControl').value) / 100;
  masterGain.connect(audioContext.destination);
  audioReady = true;
  if (audioContext.state === 'suspended') audioContext.resume();
  startAmbientBgm();
}
function ensureAudio() {
  if (!audioReady) initAudio();
  if (audioContext && audioContext.state === 'suspended') audioContext.resume();
}
function setMasterVolume() {
  if (audioReady) masterGain.gain.setTargetAtTime(
    audioEnabled ? Number($('volumeControl').value)/100 : 0,
    audioContext.currentTime, 0.08
  );
}
function startAmbientBgm() {
  if (!audioReady || bgmNodes.length) return;
  [110, 164.81, 220].forEach((frequency, i) => {
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const lfo = audioContext.createOscillator();
    const lfoGain = audioContext.createGain();
    osc.type = i === 1 ? 'sine' : 'triangle';
    osc.frequency.value = frequency;
    gain.gain.value = [0.018, 0.012, 0.008][i];
    lfo.frequency.value = 0.08 + i * 0.025;
    lfoGain.gain.value = 0.006;
    lfo.connect(lfoGain); lfoGain.connect(gain.gain);
    osc.connect(gain); gain.connect(masterGain);
    osc.start(); lfo.start();
    bgmNodes.push({osc, lfo});
  });
}
function tone(freq, duration, type='sine', volume=0.08, endFreq=null, delay=0) {
  if (!audioEnabled) return;
  ensureAudio();
  if (!audioReady) return;
  const now = audioContext.currentTime + delay;
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  if (endFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq), now+duration);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(volume, now+0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, now+duration);
  osc.connect(gain); gain.connect(masterGain);
  osc.start(now); osc.stop(now+duration+0.03);
}
function playClickSound() { tone(620, .07, 'sine', .045, 420); }
function playTypingSound() {
  const now = Date.now();
  if (now-lastTypingSound < 65) return;
  lastTypingSound = now;
  tone(900+Math.random()*250, .025, 'square', .018, 650);
}
function playCardSpinSound() {
  if (!audioEnabled) return;
  ensureAudio();
  if (!audioReady) return;
  const now = audioContext.currentTime;
  const osc = audioContext.createOscillator(), gain = audioContext.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(95, now);
  osc.frequency.exponentialRampToValueAtTime(520, now+1.85);
  gain.gain.setValueAtTime(.0001, now);
  gain.gain.linearRampToValueAtTime(.045, now+.35);
  gain.gain.setValueAtTime(.045, now+1.65);
  gain.gain.exponentialRampToValueAtTime(.0001, now+2.15);
  osc.connect(gain); gain.connect(masterGain);
  osc.start(now); osc.stop(now+2.2);
}
function playMagicBurstSound() {
  tone(180, .55, 'sawtooth', .11, 45);
  tone(880, .45, 'sine', .075, 220, .03);
  tone(1320, .65, 'sine', .045, 660, .08);
}

function playPatronusAppearSound() {

  tone(784, 0.45, 'sine', 0.04, 1046, 0.12);
  tone(1174, 0.55, 'sine', 0.035, 1568, 0.22);
  tone(1568, 0.75, 'sine', 0.045, 2093, 0.38);
}

  $('audioToggle').setAttribute('aria-pressed', String(audioEnabled));

});
